<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>6-Subject Quiz — Unlock Test</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1b2733; }
  header { background: #101827; color: #fff; padding: 14px 20px; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 18px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header small { color: #9fb0c3; font-weight: normal; font-size: 12px; }
  .pills { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #243247; color: #9fb0c3; }
  .pill.unlocked { background: #1d4ed8; color: #fff; }
  .pill.done { background: #15803d; color: #fff; }
  main { max-width: 820px; margin: 20px auto; padding: 0 16px 60px; }
  .card { background: #fff; border: 1px solid #dbe2ea; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .card h2 { margin: 0; padding: 12px 16px; font-size: 15px; background: #eef2f7; display: flex; justify-content: space-between; align-items: center; }
  .card .body { padding: 6px 16px 16px; }
  .card.locked { opacity: .65; }
  .card.locked h2 { background: #e5e7eb; }
  .card.done h2 { background: #dcfce7; color: #14532d; }
  .q { padding: 14px 0; border-bottom: 1px dashed #e5eaf0; }
  .q:last-of-type { border-bottom: none; }
  .q p { margin: 0 0 8px; font-weight: 600; }
  .opt { display: block; padding: 8px 10px; margin: 4px 0; border: 1px solid #d5dde6; border-radius: 8px; cursor: pointer; background: #fafbfc; }
  .opt:hover { border-color: #93c5fd; background: #eff6ff; }
  .opt input { margin-right: 8px; }
  .actions { position: sticky; bottom: 0; background: linear-gradient(transparent, #fff 30%); padding: 14px 0 4px; display: flex; gap: 10px; align-items: center; }
  .btn { font: inherit; padding: 9px 22px; border-radius: 8px; border: none; cursor: pointer; background: #1d4ed8; color: #fff; font-weight: 600; }
  .btn:hover { background: #1e40af; }
  .btn.ghost { background: #eef2f7; color: #334155; font-weight: normal; }
  .confirm { margin-top: 10px; border: 2px dashed #f59e0b; background: #fffbeb; border-radius: 10px; padding: 14px; display: none; }
  .confirm.show { display: block; }
  .confirm p { margin: 0 0 10px; font-weight: 600; }
  .badge { font-size: 12px; font-weight: normal; color: #15803d; }
  .timer { margin-left: auto; font-weight: normal; font-size: 13px; color: #475569; font-variant-numeric: tabular-nums; }
  .locknote { padding: 12px 16px 16px; color: #64748b; font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(80px); background: #101827; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; transition: transform .25s; z-index: 20; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>Subject Test <small>6 subjects × 5 MCQs — next subject unlocks only after double-submit</small>
    <button id="reset" class="btn ghost" style="margin-left:auto">Reset</button>
  </h1>
  <div class="pills" id="pills"></div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
const SUBJECTS = [
  { name: "Mathematics", qs: [
    { q: "What is 12 × 8?", o: ["96", "94", "98", "102"], a: 0 },
    { q: "What is the square root of 144?", o: ["10", "11", "12", "14"], a: 2 },
    { q: "If x + 7 = 15, what is x?", o: ["6", "7", "8", "9"], a: 2 },
    { q: "What is the area of a circle with radius 7 cm? (Take π = 22/7)", o: ["144 cm²", "154 cm²", "164 cm²", "150 cm²"], a: 1 },
    { q: "What comes next: 3, 6, 12, 24, ...?", o: ["36", "42", "48", "50"], a: 2 },
  ]},
  { name: "Science", qs: [
    { q: "What does H2O represent?", o: ["Water", "Methane", "Hydrogen peroxide", "Oxygen"], a: 0 },
    { q: "Which planet is closest to the Sun?", o: ["Venus", "Mercury", "Earth", "Mars"], a: 1 },
    { q: "Photosynthesis mainly takes place in which part of a plant?", o: ["Roots", "Leaves", "Stem", "Flower"], a: 1 },
    { q: "Which force pulls objects towards the Earth?", o: ["Friction", "Magnetism", "Gravity", "Inertia"], a: 2 },
    { q: "Which gas do plants absorb from the air?", o: ["Oxygen", "Nitrogen", "Carbon dioxide", "Helium"], a: 2 },
  ]},
  { name: "English", qs: [
    { q: "Choose the synonym of “rapid”.", o: ["Slow", "Quick", "Quiet", "Heavy"], a: 1 },
    { q: "What is the correct plural of “child”?", o: ["Childs", "Child", "Children", "Childrens"], a: 2 },
    { q: "Fill in the blank: “She ___ to school every day.”", o: ["go", "goes", "going", "gone"], a: 1 },
    { q: "Choose the antonym of “ancient”.", o: ["Modern", "Old", "Past", "Historical"], a: 0 },
    { q: "Which sentence is punctuated correctly?", o: ["“Hello, world.”", "“Hello world,”", "“Hello. world”", "“Hello,world.”"], a: 0 },
  ]},
  { name: "History", qs: [
    { q: "Who was the first President of the United States?", o: ["Thomas Jefferson", "Abraham Lincoln", "George Washington", "John Adams"], a: 2 },
    { q: "In which year did World War II end?", o: ["1918", "1945", "1950", "1939"], a: 1 },
    { q: "The Great Pyramids were built by which civilization?", o: ["Romans", "Greeks", "Egyptians", "Persians"], a: 2 },
    { q: "Who invented the printing press?", o: ["Isaac Newton", "Johannes Gutenberg", "Alexander Bell", "Thomas Edison"], a: 1 },
    { q: "The Great Wall is located in which country?", o: ["India", "Japan", "China", "Egypt"], a: 2 },
  ]},
  { name: "Geography", qs: [
    { q: "What is the capital of France?", o: ["London", "Berlin", "Paris", "Madrid"], a: 2 },
    { q: "Which is the largest ocean on Earth?", o: ["Pacific Ocean", "Atlantic Ocean", "Indian Ocean", "Arctic Ocean"], a: 0 },
    { q: "Which continent has the most countries?", o: ["Asia", "Africa", "Europe", "South America"], a: 1 },
    { q: "The Sahara Desert is located on which continent?", o: ["Asia", "South America", "Africa", "Australia"], a: 2 },
    { q: "Which line divides Earth into Northern and Southern hemispheres?", o: ["Tropic of Cancer", "Equator", "Prime Meridian", "International Date Line"], a: 1 },
  ]},
  { name: "Computers", qs: [
    { q: "What does CPU stand for?", o: ["Central Processing Unit", "Computer Personal Unit", "Central Program Utility", "Control Processing Unit"], a: 0 },
    { q: "What does HTML stand for?", o: ["HyperText Markup Language", "HighText Machine Language", "HyperText Markup Language (new)", "Home Tool Markup Language"], a: 0 },
    { q: "How many bytes are in 1 KB?", o: ["1000", "1024", "512", "2048"], a: 1 },
    { q: "Which of these is an input device?", o: ["Printer", "Monitor", "Keyboard", "Speaker"], a: 2 },
    { q: "Windows, macOS and Linux are examples of ___", o: ["Hardware", "Software", "Firewall", "Browsers"], a: 1 },
  ]},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomizeSet() {
  return SUBJECTS.map((s) => ({
    name: s.name,
    qs: shuffle(s.qs).map((q) => {
      const order = shuffle(q.o.map((_, i) => i));
      return { q: q.q, o: order.map((i) => q.o[i]), a: order.indexOf(q.a) };
    }),
  }));
}

let SET = randomizeSet();
window.__QUIZ_SET = () => SET;

let completed = 0; // subjects 0..completed-1 are done
let scores = [];
let timerStart = {}; // si -> perf ms when subject became active
let timerDone = {};  // si -> elapsed ms at completion

function fmtTime(ms) {
  ms = Math.max(0, Math.floor(ms));
  const h = Math.floor(ms / 3600000);
  const m = Math.floor(ms / 60000) % 60;
  const s = Math.floor(ms / 1000) % 60;
  const f = ms % 1000;
  const mm = String(m).padStart(2, "0");
  const ss = String(s).padStart(2, "0");
  const fff = String(f).padStart(3, "0");
  return (h > 0 ? `${h}:${mm}:` : `${mm}:`) + `${ss}.${fff}`;
}

function startTimer(si) {
  if (!(si in timerStart)) timerStart[si] = performance.now();
}

function stopTimer(si) {
  if (si in timerStart && !(si in timerDone)) timerDone[si] = performance.now() - timerStart[si];
}

function elapsedOf(si) {
  if (si in timerDone) return timerDone[si];
  if (si in timerStart) return performance.now() - timerStart[si];
  return 0;
}

function tickTimer() {
  const el = document.getElementById("timer");
  if (!el) return;
  const txt = "⏱ " + fmtTime(elapsedOf(completed));
  if (el.textContent !== txt) el.textContent = txt;
}
setInterval(tickTimer, 50);

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove("show"), 2600);
}

function renderPills() {
  const el = document.getElementById("pills");
  el.innerHTML = "";
  SET.forEach((s, i) => {
    const p = document.createElement("span");
    p.className = "pill" + (i < completed ? " done" : i === completed ? " unlocked" : "");
    p.textContent = (i + 1) + ". " + s.name + (i < completed ? " ✓" : i === completed ? "" : " 🔒");
    el.appendChild(p);
  });
}

function render() {
  renderPills();
  if (completed < SET.length) startTimer(completed);
  const app = document.getElementById("app");
  app.innerHTML = "";
  SET.forEach((s, si) => {
    const card = document.createElement("section");
    card.className = "card" + (si < completed ? " done" : si > completed ? " locked" : "");
    if (si < completed) {
      card.innerHTML = `<h2>Subject ${si + 1}: ${s.name}<span class="badge">✓ Completed (${scores[si]}/5) · ⏱ ${fmtTime(elapsedOf(si))}</span></h2>`;
      app.appendChild(card);
      return;
    }
    if (si > completed) {
      card.innerHTML = `<h2>Subject ${si + 1}: ${s.name} 🔒</h2>
        <div class="locknote">Locked — complete Subject ${completed + 1} (answer all 5 and double-submit) to unlock.</div>`;
      app.appendChild(card);
      return;
    }
    const h = document.createElement("h2");
    h.textContent = `Subject ${si + 1}: ${s.name} `;
    const tm = document.createElement("span");
    tm.id = "timer";
    tm.className = "timer";
    tm.textContent = "⏱ " + fmtTime(elapsedOf(si));
    h.appendChild(tm);
    card.appendChild(h);
    const body = document.createElement("div");
    body.className = "body";
    s.qs.forEach((qq, qi) => {
      const div = document.createElement("div");
      div.className = "q";
      const p = document.createElement("p");
      p.textContent = `${qi + 1}. ${qq.q}`;
      div.appendChild(p);
      qq.o.forEach((o, oi) => {
        const lab = document.createElement("label");
        lab.className = "opt";
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `s${si}q${qi}`;
        input.value = String(oi);
        lab.appendChild(input);
        lab.appendChild(document.createTextNode(String.fromCharCode(65 + oi) + ". " + o));
        div.appendChild(lab);
      });
      body.appendChild(div);
    });

    const actions = document.createElement("div");
    actions.className = "actions";
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = "Submit";
    btn.addEventListener("click", () => {
      const checked = card.querySelectorAll("input:checked");
      if (checked.length < 5) {
        showToast("Answer all 5 questions first");
        return;
      }
      btn.style.display = "none";
      confirmBox.classList.add("show");
    });
    actions.appendChild(btn);
    body.appendChild(actions);

    const confirmBox = document.createElement("div");
    confirmBox.className = "confirm";
    confirmBox.setAttribute("role", "dialog");
    confirmBox.innerHTML = `<p>Submit your answers for ${s.name}? This cannot be changed later.</p>`;
    const btn2 = document.createElement("button");
    btn2.className = "btn";
    btn2.textContent = "Submit";
    btn2.addEventListener("click", () => {
      let score = 0;
      s.qs.forEach((qq, qi) => {
        const sel = card.querySelector(`input[name="s${si}q${qi}"]:checked`);
        if (sel && Number(sel.value) === qq.a) score++;
      });
      scores[si] = score;
      stopTimer(si);
      completed = Math.min(SET.length, si + 1);
      render();
      showToast(
        completed < SET.length
          ? `Subject ${si + 1} submitted (${score}/5) — Subject ${completed} unlocked!`
          : `All done! Final score: ${scores.reduce((a, b) => a + b, 0)}/${SET.length * 5}`
      );
      const next = document.querySelectorAll(".card:not(.done):not(.locked)");
      if (next[0]) next[0].scrollIntoView({ behavior: "smooth", block: "start" });
    });
    const btn3 = document.createElement("button");
    btn3.className = "btn ghost";
    btn3.textContent = "Back";
    btn3.addEventListener("click", () => {
      confirmBox.classList.remove("show");
      btn.style.display = "";
    });
    confirmBox.appendChild(btn2);
    confirmBox.appendChild(document.createTextNode(" "));
    confirmBox.appendChild(btn3);
    body.appendChild(confirmBox);
    card.appendChild(body);
    app.appendChild(card);
  });
}

document.getElementById("reset").addEventListener("click", () => {
  SET = randomizeSet();
  completed = 0;
  scores = [];
  timerStart = {};
  timerDone = {};
  render();
  showToast("Reset — questions re-shuffled");
});

render();
</script>
</body>
</html>
