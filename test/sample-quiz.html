<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sample Quiz — MCQ Helper Test</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    fieldset { margin-bottom: 24px; border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; }
    legend { font-weight: 700; }
    label { display: block; margin: 6px 0; cursor: pointer; }
    button.option { display: block; margin: 4px 0; padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Sample Quiz</h1>
  <p>Open this file in Chrome, load the extension, open the side panel. All three questions should be detected and solved.</p>

  <fieldset>
    <legend>1. What is the capital of France?</legend>
    <label><input type="radio" name="q1" value="a" /> Berlin</label>
    <label><input type="radio" name="q1" value="b" /> Paris</label>
    <label><input type="radio" name="q1" value="c" /> Madrid</label>
    <label><input type="radio" name="q1" value="d" /> Rome</label>
  </fieldset>

  <fieldset>
    <legend>2. Which of these are prime numbers? (select all)</legend>
    <label><input type="checkbox" name="q2" value="a" /> 2</label>
    <label><input type="checkbox" name="q2" value="b" /> 4</label>
    <label><input type="checkbox" name="q2" value="c" /> 7</label>
    <label><input type="checkbox" name="q2" value="d" /> 9</label>
  </fieldset>

  <fieldset>
    <legend>3. What does HTML stand for?</legend>
    <button class="option" type="button">Hyper Text Markup Language</button>
    <button class="option" type="button">High Tech Modern Language</button>
    <button class="option" type="button">Hyperlink Text Management Language</button>
    <button class="option" type="button">Home Tool Markup Language</button>
  </fieldset>
</body>
</html>
